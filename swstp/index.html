<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telemetry Dashboard — IoT Engineering</title>
    <meta name="description" content="Real-time IoT telemetry engineering dashboard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Prevent flash of unstyled content — background set synchronously
         before bundle loads. Script below sets correct theme before paint. */
      html { background: #07090d; }
      html[data-theme="light"] { background: #f8fafc; }
    </style>
    <!-- PRE-PAINT THEME SCRIPT
         Runs synchronously during <head> parsing — before any pixel is
         rendered. This prevents flash of wrong theme on cold load to any
         route including /admin, /officer, /hardware-connect.
         Must be inline (not a module/deferred script) to be synchronous.
         Matches ThemeContext.jsx logic exactly: key='swstp_theme', default='dark'. -->
    <script>
      (function() {
        var t = localStorage.getItem('swstp_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
